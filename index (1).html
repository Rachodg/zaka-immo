  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.5;
  }
  .display{font-family:Georgia,'Times New Roman',serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;font-size:14px;}

  /* Header */
  header{
    background:var(--white);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
  }
  .header-inner{
    max-width:1100px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:var(--clay-dark);}
  .logo .mark{
    width:34px;height:34px;border-radius:8px;background:var(--clay);
    display:flex;align-items:center;justify-content:center;color:var(--ochre-light);font-size:18px;
    flex-shrink:0;
  }
  .logo .sub{font-size:11px;font-weight:400;color:var(--ink-soft);display:block;margin-top:-2px;}
  nav{display:flex;gap:6px;align-items:center;}
  .nav-btn{
    padding:9px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;
    color:var(--ink-soft);transition:background .15s;
  }
  .nav-btn:hover{background:var(--cream);}
  .nav-btn.active{background:var(--clay);color:var(--white);}
  .nav-btn.ghost-admin{color:var(--ink-soft);font-size:13px;display:flex;align-items:center;gap:5px;position:relative;}
  .notif-dot{
    position:absolute;top:-2px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
    min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  /* Hero */
  .hero{
    background:linear-gradient(180deg, rgba(42,33,24,.35) 0%, rgba(42,33,24,.65) 100%), var(--hero-img) center/cover no-repeat;
    border-bottom:1px solid var(--line);
    padding:56px 20px 36px;
  }
  .hero .eyebrow{color:var(--ochre-light);}
  .hero .eyebrow::before{background:var(--ochre-light);}
  .hero h1.display{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.25);}
  .hero-inner{max-width:1100px;margin:0 auto;}
  .eyebrow{
    font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--clay);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .eyebrow::before{content:"";width:18px;height:2px;background:var(--clay);display:inline-block;}
  h1.display{font-size:36px;color:var(--ink);max-width:560px;margin-bottom:10px;}
  .hero p{color:#fff;font-size:17px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.45);max-width:520px;margin-bottom:24px;}

  .search-box{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:16px;display:grid;grid-template-columns:1fr 1fr 0.8fr 1fr 0.9fr auto;gap:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .field-label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;display:block;}
  .search-box select, .search-box input{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--cream);color:var(--ink);
  }
  .btn-primary{
    background:var(--clay);color:var(--white);padding:10px 22px;border-radius:var(--radius);
    font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;justify-content:center;
    align-self:end;transition:background .15s;white-space:nowrap;
  }
  .btn-primary:hover{background:var(--clay-dark);}
  .btn-secondary{
    background:var(--white);color:var(--ink);border:1px solid var(--line);padding:10px 18px;
    border-radius:var(--radius);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;
  }
  .btn-secondary:hover{border-color:var(--clay);color:var(--clay);}

  /* Main content */
  main{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
  .section-title{font-size:15px;font-weight:700;color:var(--ink-soft);margin-bottom:16px;display:flex;align-items:center;justify-content:between;gap:8px;}
  .count-pill{background:var(--ochre-light);color:var(--clay-dark);font-size:12px;padding:2px 10px;border-radius:99px;font-weight:700;margin-left:8px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    overflow:hidden;transition:transform .15s, box-shadow .15s;cursor:pointer;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(42,33,24,.10);}
  .card-img{
    height:150px;background:var(--ochre-light);display:flex;align-items:center;justify-content:center;
    color:var(--ochre);font-size:34px;position:relative;overflow:hidden;
  }
  .card-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .badge-type{
    position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:4px 10px;
    border-radius:99px;text-transform:uppercase;letter-spacing:.03em;
  }
  .badge-location{background:var(--green);color:var(--white);}
  .badge-vente{background:var(--clay);color:var(--white);}
  .card-body{padding:14px 16px 16px;}
  .card-price{font-size:18px;font-weight:700;color:var(--clay-dark);margin-bottom:4px;}
  .card-price span{font-size:12px;font-weight:400;color:var(--ink-soft);}
  .card-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .card-loc{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .empty i{font-size:40px;color:var(--ochre);margin-bottom:12px;display:block;}

  /* Detail view */
  .detail-wrap{max-width:780px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:14px;font-weight:600;margin-bottom:18px;}
  .back-link:hover{color:var(--clay);}
  .detail-hero{height:280px;background:var(--ochre-light);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;color:var(--ochre);font-size:60px;margin-bottom:12px;position:relative;overflow:hidden;}
  .detail-hero img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-strip{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;}
  .gallery-strip img{width:80px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;flex-shrink:0;}
  .gallery-strip img.active{border:2px solid var(--clay);}
  .detail-head{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:6px;flex-wrap:wrap;}
  .detail-title{font-size:24px;}
  .detail-price{font-size:26px;font-weight:700;color:var(--clay-dark);white-space:nowrap;}
  .detail-loc{color:var(--ink-soft);font-size:14px;margin-bottom:20px;display:flex;align-items:center;gap:6px;}
  .detail-tags{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .tag{background:var(--cream);border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .detail-desc{color:var(--ink);font-size:15px;line-height:1.7;margin-bottom:28px;white-space:pre-wrap;}
  .contact-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;}

function resizeImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1200;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.78);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoSelect(event){
  const files = Array.from(event.target.files || []);

  if(room <= 0){ alert(`Vous pouvez ajouter au maximum ${MAX_PHOTOS} photos.`); return; }
  const toProcess = files.slice(0, room);
  const wrap = document.getElementById('photo-previews');
  for(const file of toProcess){
    try{
      const blob = await resizeImageFile(file);
      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const { error } = await supabaseClient.storage
        .from('listing-photos')
        .upload(fileName, blob, { contentType: 'image/jpeg' });
      if(error) throw error;
      const { data: pub } = supabaseClient.storage
        .from('listing-photos')
        .getPublicUrl(fileName);
      tempPhotos.push(pub.publicUrl);
      renderPhotoPreviews();
    }catch(e){
      console.error('Erreur upload photo:', e);
      alert("Erreur lors de l'envoi d'une photo. Vérifie ta configuration Supabase.");
    }
  }
  event.target.value = '';
}

function renderPhotoPreviews(){
  const wrap = document.getElementById('photo-previews');
  if(!wrap) return;
  wrap.innerHTML = tempPhotos.map((p, i) => `
    <div class="photo-thumb">
      <img src="${p}" alt="">
      <div class="rm" onclick="removePhoto(${i})"><i class="ti ti-x"></i></div>
    </div>`).join('');
}

function removePhoto(i){
  tempPhotos.splice(i, 1);
  renderPhotoPreviews();
}

async function submitListing(e){
  e.preventDefault();
  const listingDraft = {
    titre: document.getElementById('p-titre').value.trim(),
    type: document.getElementById('p-type').value,
    typeBien: document.getElementById('p-typebien').value,
    ville: document.getElementById('p-ville').value.trim(),
    quartier: document.getElementById('p-quartier').value.trim(),
    prix: document.getElementById('p-prix').value,
    description: document.getElementById('p-description').value.trim(),
    telephone: document.getElementById('p-telephone').value.trim(),
    whatsapp: document.getElementById('p-whatsapp').value.trim(),
    photos: tempPhotos.slice()
  };
  try{
    const saved = await saveListing(listingDraft);
    listings.unshift(saved);
    tempPhotos = [];
    updateAdminNotif();
    const msg = document.getElementById('publish-msg');
    msg.querySelector('span').textContent = "Annonce envoyée ! Elle sera visible après validation par l'administrateur.";
    msg.classList.add('show');
    document.getElementById('publish-form').reset();
    document.getElementById('p-ville').value = '';
    renderPhotoPreviews();
  }catch(err){
    console.error(err);
    alert("Une erreur est survenue lors de l'envoi. Vérifie ta configuration Supabase et réessaie.");
  }
}

function renderAdmin(main){
  if(!adminAuthed){
    main.innerHTML = `
      <div class="admin-login">
        <i class="ti ti-shield-lock" style="font-size:30px;color:var(--clay);margin-bottom:10px;display:block;"></i>
        <h2 style="font-size:17px;margin-bottom:14px;">Espace administrateur</h2>
        <input type="password" id="admin-pass" placeholder="Mot de passe" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;background:var(--cream);">
        <button class="btn-primary" style="width:100%;" onclick="tryAdminLogin()">Se connecter</button>
        <p style="font-size:12px;color:var(--ink-soft);margin-top:12px;">Démo : mot de passe = zaka2026</p>
      </div>`;
    return;
  }
  const tabs = [
    {id:'en_attente', label:'En attente'},
    {id:'valide', label:'Validées'},
    {id:'rejete', label:'Rejetées'},
    {id:'contacts', label:'Contacts'}
  ];
  let html = `<div class="admin-wrap">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Modération et suivi</span>
      <button class="btn-secondary" onclick="adminAuthed=false;render();"><i class="ti ti-logout"></i> Déconnexion</button>
    </div>
    <div class="admin-tabs">`;
  tabs.forEach(t => {
    let n;
    if(t.id === 'contacts') n = contacts.filter(c => !c.lu).length;
    else n = listings.filter(l => l.statut === t.id).length;
    html += `<button class="admin-tab ${adminTab===t.id?'active':''}" onclick="adminTab='${t.id}';render();">${t.label} (${n})</button>`;
  });
  html += `</div>`;

  if(adminTab === 'contacts'){
    if(contacts.length === 0){
      html += `<div class="empty"><i class="ti ti-message-circle"></i><p>Aucun contact pour le moment.</p></div>`;
    } else {
      contacts.forEach(c => {
        const date = new Date(c.timestamp).toLocaleString('fr-FR');
        html += `
        <div class="admin-row" style="${c.lu ? 'opacity:.6;' : ''}">
          <div class="admin-thumb"><i class="ti ${c.canal === 'whatsapp' ? 'ti-brand-whatsapp' : 'ti-phone'}"></i></div>
          <div class="admin-info">
            <div class="t">${escapeHtml(c.listingTitre)}</div>
            <div class="m">Contact via ${c.canal === 'whatsapp' ? 'WhatsApp' : 'appel'} · ${date} ${!c.lu ? '<span class="status-pill status-en_attente">nouveau</span>' : ''}</div>
          </div>
          <div class="admin-actions">
            ${!c.lu ? `<button class="icon-btn approve" title="Marquer comme lu" onclick="markContactRead('${c.id}')"><i class="ti ti-check"></i></button>` : ''}
          </div>
        </div>`;
      });
    }
    html += `</div>`;
    main.innerHTML = html;
    return;
  }

  const filtered = listings.filter(l => l.statut === adminTab);

  if(filtered.length === 0){
    html += `<div class="empty"><i class="ti ti-inbox"></i><p>Aucune annonce dans cette catégorie.</p></div>`;
  } else {
    filtered.forEach(l => {
      html += `
      <div class="admin-row">
        <div class="admin-thumb"><i class="ti ${iconForType(l.typeBien)}"></i></div>
        <div class="admin-info">
          <div class="t">${escapeHtml(l.titre)}</div>
          <div class="m">${moneyFmt(l.prix)} · ${escapeHtml(l.quartier)}, ${escapeHtml(l.ville)} · <span class="status-pill status-${l.statut}">${l.statut.replace('_',' ')}</span></div>
        </div>
        <div class="admin-actions">
          ${l.statut !== 'valide' ? `<button class="icon-btn approve" title="Valider" onclick="setStatut('${l.id}','valide')"><i class="ti ti-check"></i></button>` : ''}
          ${l.statut !== 'rejete' ? `<button class="icon-btn reject" title="Rejeter" onclick="setStatut('${l.id}','rejete')"><i class="ti ti-x"></i></button>` : ''}
          <button class="icon-btn reject" title="Supprimer définitivement" onclick="deleteListing('${l.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  main.innerHTML = html;
}

function tryAdminLogin(){
  const val = document.getElementById('admin-pass').value;
  if(val === ADMIN_PASS){
    adminAuthed = true;
    render();
  } else {
    alert('Mot de passe incorrect.');
  }
}

async function deleteListing(id){
  if(!confirm('Supprimer définitivement cette annonce ? Cette action est irréversible.')) return;
  try{
    const { error } = await supabaseClient
      .from('listings')
      .delete()
      .eq('id', id);
    if(error) throw error;
    listings = listings.filter(l => l.id !== id);
    updateAdminNotif();
    render();
  }catch(e){
    showDebugError('Erreur suppression', e);
  }
}

async function setStatut(id, statut){
  const l = listings.find(x => x.id === id);
  if(!l) return;
  try{
    await updateListingStatut(id, statut);
    l.statut = statut;
    updateAdminNotif();
  }catch(e){
    console.error(e);
    alert("Erreur lors de la mise à jour. Réessaie.");
  }
  render();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
